name: "build"

on:
    push:
        branches:
            - "*.x" # Matches our branch versioning that mirrors Sylius', e.g. '2.x', '2.2.x'
    pull_request: ~
    workflow_dispatch: ~

jobs:
    backwards-compatibility:
        runs-on: "ubuntu-latest"
        if: "github.event_name == 'pull_request'"
        steps:
            -   uses: "setono/sylius-plugin/backwards-compatibility@v2"
                with:
                    php-version: "8.3"

    coding-standards:
        runs-on: "ubuntu-latest"
        steps:
            # Always run on the lowest supported PHP version, so syntax newer than the floor is caught
            -   uses: "setono/sylius-plugin/coding-standards@v2"
                with:
                    php-version: "8.3"

    dependency-analysis:
        runs-on: "ubuntu-latest"
        strategy:
            fail-fast: false
            matrix:
                php-version: ["8.3", "8.4"]
                dependencies: ["lowest", "highest"]
                symfony: ["~6.4.0", "~7.4.0"]
        steps:
            -   uses: "setono/sylius-plugin/dependency-analysis@v2"
                with:
                    php-version: "${{ matrix.php-version }}"
                    dependencies: "${{ matrix.dependencies }}"
                    symfony: "${{ matrix.symfony }}"

    static-code-analysis:
        runs-on: "ubuntu-latest"
        strategy:
            fail-fast: false
            matrix:
                php-version: ["8.3", "8.4"]
                dependencies: ["lowest", "highest"]
                symfony: ["~6.4.0", "~7.4.0"]
        steps:
            -   uses: "setono/sylius-plugin/static-code-analysis@v2"
                with:
                    php-version: "${{ matrix.php-version }}"
                    dependencies: "${{ matrix.dependencies }}"
                    symfony: "${{ matrix.symfony }}"

    unit-tests:
        runs-on: "ubuntu-latest"
        strategy:
            fail-fast: false
            matrix:
                php-version: ["8.3", "8.4"]
                dependencies: ["lowest", "highest"]
                symfony: ["~6.4.0", "~7.4.0"]
        steps:
            -   uses: "setono/sylius-plugin/unit-tests@v2"
                with:
                    php-version: "${{ matrix.php-version }}"
                    dependencies: "${{ matrix.dependencies }}"
                    symfony: "${{ matrix.symfony }}"
                    testsuite: "unit"

    functional-tests:
        runs-on: "ubuntu-latest"
        strategy:
            fail-fast: false
            matrix:
                php-version: ["8.3", "8.4"]
                dependencies: ["highest"]
                symfony: ["~6.4.0", "~7.4.0"]
        steps:
            -   uses: "setono/sylius-plugin/functional-tests@v2"
                with:
                    php-version: "${{ matrix.php-version }}"
                    dependencies: "${{ matrix.dependencies }}"
                    symfony: "${{ matrix.symfony }}"
                    testsuite: "functional"
                    node-version: "22" # Webpack Encore 6 (Sylius 2.3) requires Node ^22.13 || >=24

    browser-tests:
        runs-on: "ubuntu-latest"
        steps:
            # Sets up MySQL, PHP, Node, the dependencies, the test application's assets, schema and fixtures. Without a
            # testsuite input it runs no tests, so the steps below can add the browser
            -   uses: "setono/sylius-plugin/functional-tests@v2"
                with:
                    php-version: "8.3"
                    symfony: "~7.4.0"
                    node-version: "22" # Webpack Encore 6 (Sylius 2.3) requires Node ^22.13 || >=24

            # Copies, not symlinks: playwright-symfony doesn't serve a file whose real path is outside tests/Application/public
            -   working-directory: "tests/Application"
                env:
                    APP_ENV: "test"
                    DATABASE_URL: "mysql://root:root@127.0.0.1/sylius?serverVersion=8.0"
                run: "bin/console assets:install public"

            -   run: "vendor/bin/playwright-install --with-deps chromium"

            -   env:
                    APP_ENV: "test"
                    DATABASE_URL: "mysql://root:root@127.0.0.1/sylius?serverVersion=8.0"
                run: "vendor/bin/phpunit --testsuite=browser"

    mutation-tests:
        runs-on: "ubuntu-latest"
        steps:
            -   uses: "setono/sylius-plugin/mutation-tests@v2"
                with:
                    stryker-dashboard-api-key: "${{ secrets.STRYKER_DASHBOARD_API_KEY }}"

    code-coverage:
        runs-on: "ubuntu-latest"
        steps:
            -   uses: "setono/sylius-plugin/code-coverage@v2"
                with:
                    codecov-token: "${{ secrets.CODECOV_TOKEN }}"
                    symfony: "~7.4.0" # Otherwise Symfony 8 components that only arrive transitively can mix into the 7.4 app
                    node-version: "22" # Webpack Encore 6 (Sylius 2.3) requires Node ^22.13 || >=24
